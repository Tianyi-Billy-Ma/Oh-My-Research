# Literature-review scope. Generated by /omr:literature-review Phase 1; edit
# any time. The skill re-reads this file at the start of every run.

schema_version: {{omr_version}}          # resolved at write time
slug: <kebab-case-slug>
created_at: <ISO-8601>
last_updated_at: <ISO-8601>

# Core question this corpus should answer.
research_question: <one-sentence question>

# Filtering criteria applied during search and summarization.
criteria:
  year_min: <year-or-blank>              # blank = no lower bound
  year_max: <year-or-blank>              # blank = no upper bound (i.e. current year)
  include_preprints: true
  include_workshop_papers: true
  min_citations: <int-or-blank>          # only enforced when source returns citation counts

# Source priority — order matters; knowledge-base-first by default.
# See references/source-priority.md for what each ID does and how it's queried.
sources:
  - zotero                               # mcp__zotero__* (skipped silently if unavailable)
  - local                                # papers/, literature/, prior .omr/literature/*/paper_bank.json
  - exa                                  # mcp__exa__*
  - tavily                               # mcp__tavily__*
  - brave-search                         # mcp__brave-search__*
  - huggingface                          # mcp__huggingface__* (HF papers)
  - github                               # mcp__github__* (related code, not papers directly)
  - web                                  # WebSearch + WebFetch (arXiv, DOI resolution)

# Hard cap on corpus size. Sources are queried in order until cap is reached.
max_papers: 50

# Per-source soft cap (kept consistent with Phase 2's invariant — keep diversity).
per_source_cap: 25

# Output configuration.
output_languages: [en]                   # add zh / ja / etc to emit summary.<lang>.md alongside summary.md

# -----------------------------------------------------------------------------
# Notes (comments only — not parsed).
#
# - `criteria` is enforced at search time (year_min/max, min_citations) and
#   surfaced in summary.md (include_preprints flag affects the Venue column).
# - `sources` is order-sensitive. Reorder to change priority.
# - To skip a source entirely, delete its line.
# - To override at invocation: `/omr:literature-review --sources exa,web`.
# - Re-runs against the same scope.yaml merge new finds into paper_bank.json
#   (append-only, dedup by canonical id).
# -----------------------------------------------------------------------------
